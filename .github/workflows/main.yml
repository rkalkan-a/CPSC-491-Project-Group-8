name: Unity CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'CICD/**'
      - 'docs/**'
      - '.gitignore'

  # combat tests must also run while a PR is open, not just after it merges
  pull_request:
    branches: [main]
    # a documentation-only change cannot break the game, so don't spend ~20
    # minutes of runner time pulling the Unity image to prove it.
    # (repeated rather than shared - GitHub Actions does not support YAML anchors)
    paths-ignore:
      - '**.md'
      - 'CICD/**'
      - 'docs/**'
      - '.gitignore'

  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.6.0f1

jobs:
  test:
    name: Run Unity tests
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # keep swap on: removing it frees 0B of disk and leaves Unity no memory headroom
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report disk space before Unity tests
        run: |
          echo "=== Disk space ==="
          df -h /

          echo
          echo "=== Docker disk usage ==="
          docker system df || true

          echo
          echo "=== Largest root directories ==="
          sudo du -xh -d 1 / 2>/dev/null | sort -h | tail -20

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:ubuntu-6000.6.0f1-base-3
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-${{ github.run_number }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Build (${{ matrix.targetPlatform }})
    needs: test

    # PRs only need to pass tests.
    # Full builds run after code reaches main.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        targetPlatform:
          - StandaloneOSX

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # keep swap on: removing it frees 0B of disk and leaves Unity no memory headroom
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Report disk space before Unity build
        run: |
          echo "=== Disk space ==="
          df -h /

          echo
          echo "=== Docker disk usage ==="
          docker system df || true

          echo
          echo "=== Library size ==="
          du -sh Library || true

      # the runner sometimes kills Unity right at startup (exit code 137) with
      # identical inputs, so the first attempt is allowed to fail and is retried once
      - name: Build Unity project
        id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CPSC491-Group8
          versioning: Custom
          version: 0.0.${{ github.run_number }}

      - name: Report memory after failed build
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Out-of-memory kills ==="
          sudo dmesg | grep -iE "out of memory|oom-kill|killed process" || echo "none found"

      - name: Build Unity project (retry)
        if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CPSC491-Group8
          versioning: Custom
          version: 0.0.${{ github.run_number }}

      - name: Upload Unity build
        uses: actions/upload-artifact@v4
        with:
          name: UnityBuild-${{ github.run_number }}
          path: build