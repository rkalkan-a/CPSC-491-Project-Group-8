name: Unity CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'CICD/**'
      - 'docs/**'
      - '.gitignore'

  # combat tests must also run while a PR is open, not just after it merges
  # no paths-ignore here: "Run Unity tests" is a required check on main, and a required check
  # has to report on every PR or the PR waits forever. docs-only PRs are handled by the changes
  # job below, which skips the tests. GitHub counts a skipped job as passing
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.6.0f1

jobs:

  changes:
    name: Check what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - name: Is this PR docs only?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # a documentation-only change cannot break the game, so don't spend ~20
          # minutes of runner time pulling the Unity image to prove it.
          # anything unexpected means run the tests
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename'); then
              if [ -n "$files" ] && ! echo "$files" | grep -qvE '(\.md$|^CICD/|^docs/|^\.gitignore$)'; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  test:
    name: Run Unity tests
    needs: changes
    # skipped only when the changes job says docs only. if that job itself fails, the tests still
    # run, so a broken check can never let code through untested
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Report free disk space
        run: df -h /

      - uses: actions/checkout@v4

      # TEMPORARILY DISABLED:
      # Test without restoring the Unity Library cache.
      # - uses: actions/cache@v4
      #   with:
      #     path: Library
      #     key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
      #     restore-keys: Library-test-

      - name: Diagnose disk before Unity
        run: |
          echo "Available disk:"
          df -h /

          echo "Docker disk usage:"
          docker system df

          echo "Unity Library size:"
          du -sh Library 2>/dev/null || true

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:ubuntu-6000.6.0f1-base-3
          testMode: all
          artifactsPath: artifacts

      - name: Diagnose after Unity
        if: always()
        run: |
          echo "Remaining disk:"
          df -h /

          echo "Docker disk usage:"
          docker system df

          echo "Docker containers:"
          docker ps -a

          echo "Test artifacts:"
          ls -lah artifacts/ || true
          find artifacts -maxdepth 4 -type f || true

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn


  build:
    name: Build (${{ matrix.targetPlatform }})
    needs: test

    # PRs only need to pass tests.
    # Full builds run after code reaches main.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        targetPlatform:
          - StandaloneOSX

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # removing swap frees 0B of disk on these runners, so leave it alone
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Report disk space before Unity build
        run: |
          echo "=== Disk space ==="
          df -h /

          echo
          echo "=== Docker disk usage ==="
          docker system df || true

          echo
          echo "=== Library size ==="
          du -sh Library || true

      # Unity is sometimes killed about a second after it starts on the runner (exit code 137),
      # with identical inputs. it is not an out-of-memory kill (checked with dmesg in run #52)
      # and the cause is unknown, so the build gets up to three attempts
      - name: Build Unity project
        id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CPSC491-Group8
          versioning: Custom
          version: 0.0.${{ github.run_number }}

      - name: Report memory after failed build
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Out-of-memory kills ==="
          sudo dmesg | grep -iE "out of memory|oom-kill|killed process" || echo "none found"

      - name: Build Unity project (attempt 2)
        id: build2
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CPSC491-Group8
          versioning: Custom
          version: 0.0.${{ github.run_number }}

      - name: Build Unity project (attempt 3)
        if: steps.build2.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CPSC491-Group8
          versioning: Custom
          version: 0.0.${{ github.run_number }}

      - name: Upload Unity build
        uses: actions/upload-artifact@v4
        with:
          name: UnityBuild-${{ github.run_number }}
          path: build